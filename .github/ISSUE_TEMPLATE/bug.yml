name: Bug report
description: Report reproducible behavior in the Skill, plugin package, documentation, or examples.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping make Build with LumynQ more reliable. Do not include private customer data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill instructions
        - Reference guidance
        - Plugin package
        - Installation documentation
        - Example
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the prompt, environment, steps, and smallest non-sensitive artifact needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Separate observed output from your interpretation.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: I removed credentials, personal data, confidential customer information, and proprietary Domain Packs.
          required: true
